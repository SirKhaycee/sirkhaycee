<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ridima × Sir Khaycee</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --bg-blue:#EEF7FB; --bg-cream:#FDF8F3; --bg-dark:#111111;
  --text:#111111; --text-sub:#6B7280; --border:#E5E7EB;
  --orange:#F97316; --cyan:#22D3EE; --green:#10B981; --red:#EF4444;
  --purple:#7B5CF7; --yellow:#F59E0B;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;color:var(--text);background:var(--bg)}
a{text-decoration:none;color:inherit}

.page{max-width:680px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}

/* HEADER */
header{padding:1.25rem 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:.625rem}
.logo-img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--cyan)}
.logo-text{font-family:'Syne',sans-serif;font-size:.9375rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.logo-text span{color:var(--cyan)}
.collab-badge{font-family:'Space Mono',monospace;font-size:.75rem;font-weight:700;
  background:var(--bg-cream);border:1.5px solid var(--border);
  border-radius:999px;padding:.3rem .875rem;color:var(--text-sub)}

/* HERO */
.hero-wrap{background:var(--bg-cream);padding-block:1px}
.hero{padding:2.5rem 0 2rem;border-bottom:1px solid #E9E0D5}
.contract-tag{display:inline-flex;align-items:center;gap:.4rem;
  font-size:.6875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--orange);margin-bottom:1rem}
.contract-tag::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--orange)}
.hero-hl{font-family:'Syne',sans-serif;
  font-size:clamp(2rem,8vw,3.25rem);font-weight:800;line-height:1.05;letter-spacing:-.03em;
  margin-bottom:.875rem}
.hero-hl .u{display:inline-block;position:relative}
.hero-hl .u::after{content:'';position:absolute;bottom:-4px;left:0;right:0;
  height:5px;background:var(--orange);border-radius:3px}
.hero-meta{font-size:.875rem;color:var(--text-sub);margin-bottom:1.25rem}
.hero-meta strong{color:var(--text)}
.dpill{display:inline-flex;align-items:center;gap:.5rem;
  border-radius:999px;padding:.45rem 1rem;font-weight:700;font-size:.8125rem}
.dpill.warn{background:rgba(239,68,68,.08);border:1.5px solid rgba(239,68,68,.2);color:var(--red)}
.dpill.ok{background:rgba(16,185,129,.08);border:1.5px solid rgba(16,185,129,.2);color:var(--green)}

/* SECTION */
.sec{padding:2rem 0}
.sec-title{font-family:'Syne',sans-serif;font-size:1.625rem;font-weight:800;line-height:1;margin-bottom:1.5rem}
.sec-title::after{content:'';display:block;width:48px;height:4px;background:var(--orange);border-radius:2px;margin-top:.625rem}

/* STAT CARDS */
.num-stack{display:flex;flex-direction:column;gap:.5rem}
.nc{border-radius:16px;padding:1.25rem 1.5rem}
.nc.black{background:var(--bg-dark);color:#FFF}
.nc.orange{background:var(--orange);color:#FFF}
.nc.cyan{background:var(--cyan);color:#111}
.nc-top{display:flex;align-items:baseline;gap:.625rem;margin-bottom:.25rem}
.nc-num{font-family:'Syne',sans-serif;font-size:1.75rem;font-weight:800;line-height:1}
.nc-label{font-size:.9375rem;font-weight:600}
.nc-sub{font-size:.8125rem;opacity:.7}

/* PROGRESS */
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.625rem}
.prog-title{font-family:'Syne',sans-serif;font-size:.875rem;font-weight:700}
.prog-frac{font-family:'Space Mono',monospace;font-size:.875rem;font-weight:700;color:var(--orange)}
.track{height:7px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:1.5rem}
.fill{height:100%;border-radius:4px;background:var(--orange)}

/* POST CARDS */
.posts{display:flex;flex-direction:column;gap:1rem}
.post{border-radius:20px;overflow:hidden}
.post.cc{background:linear-gradient(145deg,#083344,#0E7490)}
.post.co{background:linear-gradient(145deg,#431407,#9A3412)}
.post.cp{background:linear-gradient(145deg,#1E1245,#4C1D95)}
.post.ct{background:linear-gradient(145deg,#022C22,#065F46)}

.post-top{padding:1.25rem 1.25rem 1rem;display:flex;gap:1rem;align-items:flex-start}
.post-n{font-family:'Syne',sans-serif;font-size:3rem;font-weight:800;line-height:1;
  color:rgba(255,255,255,.2);flex-shrink:0}
.post-info{flex:1;min-width:0}
.post-link{display:block;font-size:.8125rem;font-weight:600;color:rgba(255,255,255,.85);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:.35rem}
.post-link:hover{color:#FFF}
.post-tags{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.post-date{font-family:'Space Mono',monospace;font-size:.6875rem;color:rgba(255,255,255,.5)}
.tlive{font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(16,185,129,.25);color:#6EE7B7;border-radius:4px;padding:.15rem .4rem}
.tpend{font-size:.6rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.45);border-radius:4px;padding:.15rem .4rem}

.post-stats{background:#FFF;display:grid;grid-template-columns:repeat(5,1fr);
  padding:.875rem 1.25rem;border-top:1px solid rgba(255,255,255,.1)}
@media(max-width:440px){.post-stats{grid-template-columns:repeat(3,1fr)}}
.ps{text-align:center;padding:.25rem 0}
.psn{font-family:'Space Mono',monospace;font-size:.9rem;font-weight:700;color:var(--text)}
.psl{font-size:.5625rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-sub);margin-top:.15rem}

.post-vid{background:#F9FAFB;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:.875rem;padding:.5rem 1.25rem}
.vl{font-size:.5625rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  background:var(--bg-dark);color:#FFF;border-radius:3px;padding:.15rem .4rem}
.vs{font-family:'Space Mono',monospace;font-size:.8125rem;font-weight:700}
.vs span{font-family:'Inter',sans-serif;font-size:.6875rem;color:var(--text-sub);font-weight:400;margin-left:.25rem}

.pend{background:var(--bg-cream);border:1.5px dashed var(--border);
  border-radius:16px;padding:.875rem 1.25rem;display:flex;align-items:center;gap:.875rem}
.pend-n{font-family:'Syne',sans-serif;font-size:1.75rem;font-weight:800;color:var(--border)}
.pend-t{font-size:.8125rem;color:var(--text-sub)}

/* REFERRAL */
.ref-card{background:var(--bg-cream);border-radius:20px;padding:1.5rem;border:1.5px solid var(--border)}
.ref-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:1.25rem}
.code-pill{font-family:'Space Mono',monospace;font-size:1rem;font-weight:700;
  background:var(--bg-dark);color:var(--cyan);border-radius:8px;padding:.35rem .875rem}
.ref-code-label{font-size:.75rem;color:var(--text-sub);margin-left:.5rem}
.ref-earnings{font-family:'Space Mono',monospace;font-size:1.25rem;font-weight:700;color:var(--green)}
.ref-pills{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.rp{background:#FFF;border:1.5px solid var(--border);border-radius:12px;padding:.875rem .75rem;text-align:center}
.rpn{font-family:'Space Mono',monospace;font-size:1.125rem;font-weight:700;line-height:1}
.rpl{font-size:.5625rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-sub);margin-top:.25rem}
.rpnote{font-size:.6rem;color:var(--text-sub);margin-top:.2rem}

/* VOLUME */
.vol-card{background:var(--bg-dark);border-radius:20px;padding:1.5rem;color:#FFF}
.vcl{font-size:.6875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:.35rem}
.vcn{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;line-height:1}
.vcn.pend{font-size:.9375rem;color:rgba(255,255,255,.4)}
.vt{margin-top:1.25rem}
.vtr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.4rem}
.vtl{font-size:.6875rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.vta{font-family:'Space Mono',monospace;font-size:.875rem;font-weight:700}
.vtrack{height:6px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.vfo{height:100%;background:var(--orange);border-radius:4px}
.vfg{height:100%;background:var(--green);border-radius:4px}

/* FOOTER */
footer{background:var(--bg-dark);border-radius:20px 20px 0 0;padding:2rem 0;margin-top:2.5rem}
footer .page{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
.flogo{display:flex;align-items:center;gap:.5rem}
.flogo-img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1.5px solid var(--cyan)}
.flogo-text{font-family:'Syne',sans-serif;font-size:.8125rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#FFF}
.flogo-text span{color:var(--cyan)}
.fts{font-family:'Space Mono',monospace;font-size:.6875rem;color:rgba(255,255,255,.35)}
</style>
</head>
<body>

<div class="page">
<header>
  <div class="logo">
    <img src="../../images/pfp.jpg" class="logo-img" alt="Sir Khaycee">
    <div class="logo-text">Sir <span>Khaycee</span></div>
  </div>
  <div class="collab-badge">× Ridima</div>
</header>
</div>

<div class="hero-wrap">
<div class="page">
<div class="hero">
  <div class="contract-tag">KOL Contract · Month 1</div>
  <h1 class="hero-hl">Here's what I've built<br>for <span class="u">Ridima</span> 👇</h1>
  <p class="hero-meta"><strong>@sirkhaycee</strong> · Oct 22 – Nov 21, 2026 · $1,500 USD</p>
  <div class="dpill warn" id="dpill">⚠️ Loading…</div>
</div>
</div>
</div>

<div class="page">

<div class="sec">
  <div class="sec-title">The Numbers</div>
  <div class="num-stack" id="numStack"></div>
</div>

<div class="sec" style="padding-top:0">
  <div class="sec-title">Posts Delivered</div>
  <div class="prog-row">
    <div class="prog-title">Deliverables</div>
    <div class="prog-frac" id="pf">— / 10</div>
  </div>
  <div class="track"><div class="fill" id="pb" style="width:0%"></div></div>
  <div class="posts" id="pl"></div>
</div>

<div class="sec" style="padding-top:0">
  <div class="sec-title">Referral Performance</div>
  <div class="ref-card" id="rb"></div>
</div>

<div class="sec" style="padding-top:0">
  <div class="sec-title">Trading Volume</div>
  <div class="vol-card" id="vb"></div>
</div>

</div>

<footer>
  <div class="page">
    <div class="flogo">
      <img src="../../images/pfp.jpg" class="flogo-img" alt="Sir Khaycee">
      <div class="flogo-text">Sir <span>Khaycee</span></div>
    </div>
    <div class="fts" id="fts">Updated —</div>
  </div>
</footer>

<script>
const C={
  endIso:"2026-11-21",total:10,
  referral:{code:"sirkhaycee",earnings:"₦4,500.00",totalRefs:101,eligibleRefs:3},
  volume:{current:null,softTarget:10000000,hardTarget:20000000},
  posts:[
    {num:1,date:"Nov 7, 2026",url:"https://x.com/sirkhaycee/status/2119089995000823847",
     impressions:2946,engagements:36,likes:22,retweets:3,replies:3},
    {num:2,date:"Nov 16, 2026",url:"https://x.com/sirkhaycee/status/2122331500607680744",
     impressions:3755,engagements:99,likes:49,retweets:5,replies:12,
     video:{views:501,uniqueViews:334}},
    {num:3,date:"Nov 17, 2026",url:"https://x.com/sirkhaycee/status/2122701305449701601"},
  ],
  updatedAt:"Nov 17, 2026",
};
(function(){
  const fmt=n=>n==null?'—':n.toLocaleString();
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const fmtN=n=>'₦'+n.toLocaleString('en-NG');
  const posts=C.posts,done=posts.length,left=C.total-done;
  const pct=Math.min(100,Math.round(done/C.total*100));
  const totalImp=posts.reduce((s,p)=>s+(p.impressions||0),0);
  const totalEng=posts.reduce((s,p)=>s+(p.engagements||0),0);
  const daysLeft=Math.max(0,Math.ceil((new Date(C.endIso+'T23:59:59')-new Date())/86400000));
  const COLS=['cc','co','cp','ct','cc','co','cp','ct','cc','co'];

  // deadline
  const dp=document.getElementById('dpill');
  if(done>=C.total){dp.className='dpill ok';dp.textContent='✅ All posts delivered!';}
  else if(daysLeft===0){dp.className='dpill warn';dp.textContent=`🚨 Deadline passed — ${left} post${left>1?'s':''} not delivered`;}
  else if(daysLeft<=3){dp.className='dpill warn';dp.textContent=`🚨 ${left} post${left>1?'s':''} left · ${daysLeft} day${daysLeft!==1?'s':''} to go`;}
  else{dp.className='dpill warn';dp.textContent=`⏳ ${left} post${left>1?'s':''} left · ${daysLeft} day${daysLeft!==1?'s':''} remaining`;}

  // numbers
  document.getElementById('numStack').innerHTML=`
    <div class="nc black"><div class="nc-top"><div class="nc-num">${fmt(totalImp)}</div><div class="nc-label">Total Impressions</div></div><div class="nc-sub">Across ${done} post${done!==1?'s':''} delivered so far</div></div>
    <div class="nc orange"><div class="nc-top"><div class="nc-num">${fmt(totalEng)}</div><div class="nc-label">Total Engagements</div></div><div class="nc-sub">Likes, retweets &amp; replies combined</div></div>
    <div class="nc cyan"><div class="nc-top"><div class="nc-num">${C.referral.totalRefs}</div><div class="nc-label">Referrals</div></div><div class="nc-sub">via code "${esc(C.referral.code)}" · ${C.referral.eligibleRefs} eligible (&gt;$100 traded)</div></div>`;

  // progress
  document.getElementById('pf').textContent=`${done} / ${C.total}`;
  document.getElementById('pb').style.width=pct+'%';

  // posts
  let h='';
  posts.forEach((p,i)=>{
    const hs=p.impressions!=null;
    const sh=p.url.replace('https://x.com/sirkhaycee/status/','x.com/…/');
    h+=`<div class="post ${COLS[i]}"><div class="post-top"><div class="post-n">${String(p.num).padStart(2,'0')}</div><div class="post-info"><a class="post-link" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(sh)}</a><div class="post-tags"><span class="post-date">${esc(p.date)}</span><span class="${hs?'tlive':'tpend'}">${hs?'Live':'Stats Pending'}</span></div></div></div>`;
    if(hs){
      h+=`<div class="post-stats"><div class="ps"><div class="psn">${fmt(p.impressions)}</div><div class="psl">Impr.</div></div><div class="ps"><div class="psn">${fmt(p.engagements)}</div><div class="psl">Engs.</div></div><div class="ps"><div class="psn">${fmt(p.likes)}</div><div class="psl">Likes</div></div><div class="ps"><div class="psn">${fmt(p.retweets)}</div><div class="psl">RTs</div></div><div class="ps"><div class="psn">${fmt(p.replies)}</div><div class="psl">Replies</div></div></div>`;
      if(p.video)h+=`<div class="post-vid"><span class="vl">VIDEO</span><span class="vs">${fmt(p.video.views)}<span>views</span></span><span class="vs">${fmt(p.video.uniqueViews)}<span>unique</span></span></div>`;
    }else{
      h+=`<div class="post-stats" style="opacity:.3"><div class="ps"><div class="psn">—</div><div class="psl">Impr.</div></div><div class="ps"><div class="psn">—</div><div class="psl">Engs.</div></div><div class="ps"><div class="psn">—</div><div class="psl">Likes</div></div><div class="ps"><div class="psn">—</div><div class="psl">RTs</div></div><div class="ps"><div class="psn">—</div><div class="psl">Replies</div></div></div>`;
    }
    h+=`</div>`;
  });
  for(let i=done;i<C.total;i++)h+=`<div class="pend"><div class="pend-n">${String(i+1).padStart(2,'0')}</div><div class="pend-t">Pending…</div></div>`;
  document.getElementById('pl').innerHTML=h;

  // referral
  const r=C.referral;
  document.getElementById('rb').innerHTML=`<div class="ref-header"><div style="display:flex;align-items:center"><div class="code-pill">${esc(r.code)}</div><span class="ref-code-label">Referral code</span></div><div class="ref-earnings">${esc(r.earnings)}</div></div><div class="ref-pills"><div class="rp"><div class="rpn">${r.totalRefs}</div><div class="rpl">Total Refs</div></div><div class="rp"><div class="rpn" style="color:var(--green)">${r.eligibleRefs}</div><div class="rpl">Eligible</div><div class="rpnote">&gt;$100 traded</div></div><div class="rp"><div class="rpn" style="color:var(--orange)">${r.totalRefs-r.eligibleRefs}</div><div class="rpl">Below $100</div><div class="rpnote">growing</div></div></div>`;

  // volume
  const v=C.volume,hc=v.current!=null&&v.current>0;
  const sp=hc?Math.min(100,Math.round(v.current/v.softTarget*100)):0;
  const hp=hc?Math.min(100,Math.round(v.current/v.hardTarget*100)):0;
  document.getElementById('vb').innerHTML=`<div class="vcl">Current Volume</div><div class="vcn ${hc?'':'pend'}">${hc?fmtN(v.current):'Awaiting data from RDM team'}</div><div class="vt"><div class="vtr"><span class="vtl">Soft Target</span><span class="vta" style="color:var(--orange)">${fmtN(v.softTarget)} <small style="font-size:.6875rem;opacity:.6">${sp}%</small></span></div><div class="vtrack"><div class="vfo" style="width:${sp}%"></div></div></div><div class="vt" style="margin-top:.875rem"><div class="vtr"><span class="vtl">Hard Target</span><span class="vta" style="color:var(--green)">${fmtN(v.hardTarget)} <small style="font-size:.6875rem;opacity:.6">${hp}%</small></span></div><div class="vtrack"><div class="vfg" style="width:${hp}%"></div></div></div>`;

  document.getElementById('fts').textContent='Updated '+C.updatedAt;
})();
</script>
</body>
</html>
